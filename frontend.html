<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Support Toolkit</title>
<style>:root{--bg:#0b0c0f;--panel:#15171b;--line:#292d33;--text:#f4f4f5;--muted:#9ca3af;--accent:#ff7a18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}.wrap{max-width:1150px;margin:auto;padding:28px}.brand{font-size:24px;font-weight:900}.brand b{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.panel{margin-top:14px}.num{font-size:28px;font-weight:900}.muted{color:var(--muted)}button{background:var(--accent);color:#111;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="brand">IT SUPPORT <b>TOOLKIT</b></div><p class="muted">Diagnostico somente leitura para suporte e infraestrutura.</p></div><button onclick="load()">Executar diagnostico</button></div>
<div class="grid"><div class="card"><div class="muted">CPU</div><div id="cpu" class="num">-</div></div><div class="card"><div class="muted">Memoria</div><div id="mem" class="num">-</div></div><div class="card"><div class="muted">Internet</div><div id="net" class="num">-</div></div><div class="card"><div class="muted">DNS</div><div id="dns" class="num">-</div></div></div>
<div class="panel"><h3>Resumo</h3><div id="summary" class="muted">Execute um diagnostico.</div></div>
<div class="panel"><h3>Discos</h3><table><thead><tr><th>Dispositivo</th><th>Montagem</th><th>Total</th><th>Livre</th><th>Uso</th></tr></thead><tbody id="disks"></tbody></table></div>
<div class="panel"><h3>Processos em destaque</h3><table><thead><tr><th>PID</th><th>Processo</th><th>CPU</th><th>Memoria</th></tr></thead><tbody id="procs"></tbody></table></div></div>
<script>async function load(){let d=await (await fetch("/diagnostic")).json();cpu.textContent=d.cpu.percent+"%";mem.textContent=d.memory.percent+"%";net.textContent=d.connectivity.internet_ip_test?"OK":"Falha";dns.textContent=d.connectivity.dns.ok?"OK":"Falha";summary.innerHTML="<b>"+d.hostname+"</b><br>"+d.os+"<br><br>"+d.recommendations.map(x=>"â€¢ "+x).join("<br>");disks.innerHTML=d.disks.map(x=>`<tr><td>${x.device}</td><td>${x.mount}</td><td>${x.total_gb} GB</td><td>${x.free_gb} GB</td><td>${x.used_percent}%</td></tr>`).join("");procs.innerHTML=d.top_processes.map(x=>`<tr><td>${x.pid}</td><td>${x.name}</td><td>${x.cpu_percent}%</td><td>${x.memory_percent}%</td></tr>`).join("")}</script></body></html>
